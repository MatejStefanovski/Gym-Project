services:
  frontend:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    cpus: 0.1
    mem_limit: 128m
    volumes:
      - app-templates:/usr/share/nginx/html
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  backend:
    image: ghcr.io/matejstefanovski/delovna-proekt:latest
    cpus: 0.25
    mem_limit: 256m
    volumes:
      - .stack-data/media:/app/media
      - .stack-data/db:/app/database
      - app-templates:/app/templates/my_app
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  app-templates:
